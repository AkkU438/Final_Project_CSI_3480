<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=width=device-width,initial-scale=1">
        <style>
  body {
    font-family: Arial, sans-serif;
    max-width: 500px;
    margin: 50px auto;
    background-color: #f9f9f9;
    padding: 20px;
    border-radius: 8px;
  }

  h1 {
    text-align: center;
  }

  #todoInput {
    width: 70%;
    padding: 10px;
    margin-right: 5px;
  }

  button {
    padding: 10px;
  }

  ul {
    list-style-type: none;
    padding: 0;
  }

  li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    padding: 10px;
    margin: 5px 0;
    border-radius: 5px;
  }

  li.completed span {
    text-decoration: line-through;
    color: gray;
  }

  li input[type="text"] {
    width: 70%;
  }

  .actions button {
    margin-left: 5px;
  }

  #clearCompleted {
    margin-top: 10px;
  }
</style>
    </head>
    <body>
        <input type="text" id="todoInput" placeholder="Add a new task">
        <button onclick="addTodo()">Add</button>

        <ul id="todoList"></ul>

        <button id="clearCompleted" onclick="clearCompleted()">Clear Completed</button>
        <script src="passwordStorage.js" defer></script>
    </body>
</html>
