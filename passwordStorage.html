<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="password storage" content="Simple password manager" />
    <link rel="stylesheet" href="passwordStorage.css">
  </head>
  <body>
    <script src="passwordStorage.js" defer></script>
    <h1>Password Manager</h1>
    <p>Create, Store, and Edit Your Passwords Here!!!</p>
    
    
    <input type="text" id="search" placeholder="Search...">
    <br><br>

    <form id="form">
      <div>
        <label for="website">Website Name</label>
        <input type="text" id="website" placeholder="Password Manager">
      </div>

      <div>
        <label for="password">Password</label>
        <input type="text" id="password" placeholder="=396Xt36g`%;">
      </div>
      
      <button type="Submit">Add Password</button>
    </form>

    <h3>Previous Passwords</h3>
    <ul id="password-list">

    </ul>
  </body>
</html>
