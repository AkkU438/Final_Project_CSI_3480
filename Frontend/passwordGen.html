<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Password Generator</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="password generator" content="simple password generator" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
  <link rel="stylesheet" href="passwordGen.css">
</head>
<body>
  <ul>
    <li><a href="index.html">Password Manager</a></li>
    <li><a href="passwordGen.html">Password Generator</a></li>
  </ul>
  <h1>Password Generator</h1>
  <script src="PasswordGenerator.js" defer></script>
  <p id="password"></p>
  <br>
  <label for="slider">Length</label>
  <input type="range" id="slider" min="8" max="64" value="12">
  <span id="output">12</span>
  <button id="generate">Generate</button>
  <button id="copy">Copy</button>
  
  <form>
    <label><input type="checkbox" id="value1" checked>uppercase</label>
    <label><input type="checkbox" id="value2" checked>lowercase</label>
    <label><input type="checkbox" id="value3" checked>numbers</label>
    <label><input type="checkbox" id="value4" checked>symbols</label>
  </form>
</body>
</html>
