<!DOCTYPE html>
<html>
  <head>
    <title>Password Manager</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="password storage" content="Simple password manager" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
    <link rel="stylesheet" href="passwordStorage.css">
  </head>
  <body>
    <div class="container">
      <ul>
        <li><a href="index.html">Password Manager</a></li>
        <li><a href="passwordGen.html">Password Generator</a></li>
        <li><button id="logoutBtn">Logout</button></li>
      </ul>
      <h1>Password Manager</h1>
      <p>Create, Store, and Edit Your Passwords Here!!!</p>
      
      <div style="margin-bottom: 1.5rem;">
        <input type="text" id="search" placeholder="Search...">
        <label for="sort" style="display: inline-block; margin-left: 1rem;">Sort:</label>
        <select id="sort" style="display: inline-block; width: auto; margin-left: 0.5rem;">
          <option value="az">A-Z</option>
          <option value="za">Z-A</option>
        </select>
      </div>

      <form id="form">
        <div>
          <label for="website">Website Name</label>
          <input type="text" id="website" placeholder="Password Manager">
        </div>

        <div>
          <label for="password">Password</label>
          <input type="text" id="password" placeholder="=396Xt36g`%;">
        </div>
        
        <button type="Submit">Add Password</button>
      </form>

      <h3>Saved Passwords</h3>
      <ul id="password-list">

      </ul>
    </div>
    <script src="passwordStorage.js" defer></script>
  </body>
</html>
